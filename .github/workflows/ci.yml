name: CI

on:
  push:
    branches:
      - main
      - 'epic/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_projetoreal_test
          MYSQL_USER: springuser
          MYSQL_PASSWORD: springpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: ./mvnw -B compile

      - name: Rodar testes
        run: ./mvnw -B test

      - name: Lint (Checkstyle — não bloqueia por enquanto)
        run: ./mvnw -B checkstyle:check
        continue-on-error: true