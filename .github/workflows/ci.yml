name: CI

on:
  push:
    branches:
      - main
      - 'epic/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar
        run: ./mvnw -B compile

      - name: Rodar testes
        run: ./mvnw -B test

      - name: Lint (Checkstyle — não bloqueia por enquanto)
        run: ./mvnw -B checkstyle:check
        continue-on-error: true