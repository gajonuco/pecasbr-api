server.port=${SERVER_PORT:8080}
app.public-url=${APP_PUBLIC_URL:http://localhost:4222}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_projetoreal?useTimezone=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:springuser}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

asaas.url=${ASAAS_URL:https://api-sandbox.asaas.com/v3}
asaas.apikey=${ASAAS_API_KEY}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE